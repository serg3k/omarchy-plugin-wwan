name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  model-and-catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check modem model and locale handling
        run: |
          node test-model.js
          node tests/test-locale.js
      - name: Check translation catalogs
        run: python3 -m unittest discover -s tests -v
